  AI_PROMPT_INVOCATIONS: 'AI Prompt Invocations: This metric measures the total count of AI Prompts invocations.'
  AI_TOOL_INVOCATION_SUCCESS: 'AI Tool Invocation Success: This metric measures the total count of AI Tools invocations that
