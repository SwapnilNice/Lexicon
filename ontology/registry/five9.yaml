slug: five9
name: "Five9"
aliases:
  - "Five9 VCC"
  - "Five9 Virtual Contact Center"
category: fixed_schema
description: >
  Five9 Virtual Contact Center — cloud CCaaS. Historical statistics are
  exposed via the Statistics API (SOAP/WSDL) and the MASH reporting REST
  API. Authoritative WSDL references live on the Five9 community site;
  the developer portal is JS-rendered and largely gated behind login.

sources:
  # Community article — publicly reachable, describes the WSDL location
  # and how to consume the Statistics API. Not gated.
  - kind: html_doc
    role: primary
    url: https://community.five9.com/s/article/API-WSDL-file-used-by-Five9?language=en_US
    crawl:
      max_depth: 1
      max_pages: 5

  # Vendor documentation portal (Zoomin-hosted). JS-rendered and mostly
  # auth-gated, so v1's fetcher won't get much here — kept as a pointer
  # for humans and for a future headless-browser fetcher (sub-project B1).
  - kind: html_doc
    role: secondary
    url: https://documentation.five9.com/
    crawl:
      max_depth: 1
      max_pages: 5

version:
  system_version: "current"
  last_verified: "2026-08-09"
