slug: five9
name: "Five9"
aliases:
  - "Five9 VCC"
  - "Five9 Virtual Contact Center"
category: fixed_schema
description: >
  Five9 Virtual Contact Center — cloud CCaaS. Historical statistics are
  exposed via the Statistics API (SOAP/WSDL) and the MASH reporting REST
  API. Documentation is hosted on Zoomin (documentation.five9.com) but
  the actual PDF assets are served from documentation-be.five9.com.

sources:
  # Dashboard & Report Catalog — the primary reference for metric names,
  # definitions, and formulas. Enumerates every metric available in the
  # Five9 dashboards and reports UI.
  - kind: html_doc
    role: primary
    url: https://documentation-be.five9.com/bundle/dashboard-report-catalog/raw/resource/enus/dashboard-report-catalog.pdf
    crawl:
      max_depth: 0
      max_pages: 1

  # Basic Administrator's Guide — reference for object model and permissions.
  - kind: html_doc
    role: secondary
    url: https://documentation-be.five9.com/bundle/basic-administrators-guide/raw/resource/enus/basic-administrators-guide.pdf
    crawl:
      max_depth: 0
      max_pages: 1

  # Administrator Console — additional context on skills, campaigns, dispositions.
  - kind: html_doc
    role: secondary
    url: https://documentation-be.five9.com/bundle/administrator-console/raw/resource/enus/administrator-console.pdf
    crawl:
      max_depth: 0
      max_pages: 1

access:
  - method: soap_api
    description: >
      Statistics API (SOAP/WSDL) delivers historical + real-time supervisor
      statistics. Statistics endpoint has separate WSDLs per role.
    endpoint: "https://api.five9.com/wssupervisor/v13_0/SupervisorWebService?wsdl"
    format: "soap_envelope"
    auth: [basic_auth]
    docs: "https://documentation-be.five9.com/bundle/dashboard-report-catalog/raw/resource/enus/dashboard-report-catalog.pdf"
    notes: "Basic auth with Five9 admin credentials. WSDL varies by version — check with your Five9 rep for current version."

  - method: rest_api
    description: >
      Reporting REST API (MASH) — modern JSON-based alternative to the
      Statistics SOAP API for pulling historical reports.
    endpoint: "https://<vcc>.five9.com/mash/v2/reports"
    format: "json"
    auth: [oauth2_client_credentials, basic_auth]
    notes: "Newer API — coverage of historical metrics is expanding. Check availability for your VCC edition."

  - method: file_export
    description: >
      Scheduled report exports via VCC UI — reports can be scheduled and
      pushed to email or delivered via FTP.
    format: "csv"
    auth: [basic_auth, sshkey]

version:
  system_version: "current"
  last_verified: "2026-08-09"
