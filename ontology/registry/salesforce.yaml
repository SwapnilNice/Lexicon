slug: salesforce
name: "Salesforce Service Cloud"
aliases:
  - "Salesforce"
  - "SFDC"
  - "Service Cloud"
  - "Salesforce Omni-Channel"
  - "Service Cloud Voice"
category: flow_configured
description: >
  Salesforce Service Cloud is a flow-configured CRM/CCaaS platform. Unlike
  fixed-schema ACDs (Avaya CMS, Genesys Cloud), the ACD data footprint on
  Salesforce is EMERGENT from configured flows — which objects hold which
  data depends on how the customer's admin has set up Omni-Channel routing,
  Presence Configurations, and Service Channels.
  .
  For Salesforce, do NOT run the schema-extraction pipeline (sub-project A).
  Instead, use the Flow Blueprint capability (sub-project B2) which
  documents what the admin must configure. See:
  .
    ontology/blueprints/salesforce/queue_based.md
  .
  Additional blueprints (skill_based, presence_aware, overflow_escalation)
  can be authored following the same framework.

# sources: empty for flow_configured platforms — the "source" IS the
# blueprint document, not a fetch URL.
sources: []

access:
  - method: rest_api
    description: >
      Salesforce REST API — SOQL queries against Omni-Channel objects
      (AgentWork, PendingServiceRouting, UserServicePresence, VoiceCall).
      Best path for aggregating historical ACD data from configured flows.
    endpoint: "https://<instance>.my.salesforce.com/services/data/v60.0/query"
    format: "json"
    auth: [oauth2_client_credentials, oauth2_authorization_code, sso_saml]
    docs: "https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/"
    notes: "Connected App with OAuth is the standard integration path. Server-to-server uses JWT bearer flow (client_credentials variant)."

  - method: streaming
    description: >
      Platform Events / Change Data Capture over CometD / Pub-Sub API.
      Delivers real-time notifications when AgentWork / UserServicePresence
      rows change, without polling.
    format: "json"
    auth: [oauth2_client_credentials, oauth2_authorization_code]
    docs: "https://developer.salesforce.com/docs/platform/pub-sub-api/overview"

  - method: file_export
    description: >
      Bulk API 2.0 — asynchronous large-volume query export. Useful for
      backfilling long historical windows without hitting REST rate limits.
    format: "csv"
    auth: [oauth2_client_credentials]
    docs: "https://developer.salesforce.com/docs/atlas.en-us.api_asynch.meta/api_asynch/"

version:
  system_version: "Spring '26"
  last_verified: "2026-08-09"
